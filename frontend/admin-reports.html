<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quoridor Admin: Reports</title>
    <link rel="stylesheet" href="/css/tokens.css?v=2.0.1">
    <link rel="stylesheet" href="/css/admin.css?v=1.0.0">
    <script src="/js/admin-shell.js?v=1.1.0" defer></script>
<script defer src="https://analytics.playquor.org/script.js" data-exclude-search="true" data-website-id="4efbc356-ed5e-4f8b-9761-c00a500f67c2"></script>
<script src="/js/analytics.js?v=1.5.1"></script>
</head>
<body class="admin-app" data-admin-page="reports">
<main class="admin-main container" id="adminMain" tabindex="-1">
    <header class="admin-page-heading"><div><div class="admin-eyebrow">Moderation</div><h1>Support inbox</h1><p class="admin-page-description">Investigate issues and reply to your players.</p></div><div class="admin-page-actions"><button class="refresh-btn" onclick="loadReports()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>Refresh</button></div></header>

    <div class="panel">
        <div class="filter-bar">
            <span>Status filter:</span>
            <select id="statusFilter" aria-label="Filter reports by status" onchange="loadReports()">
                <option value="all">All</option>
                <option value="new">New</option>
                <option value="in_progress">In Progress</option>
                <option value="closed">Closed</option>
            </select>
            <span style="margin-left: auto; color: var(--muted); font-size: 13px;" id="reportCount"></span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Player</th>
                    <th>Subject</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="reportBody">
                <tr><td colspan="5" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<div id="detailModal" class="modal-overlay" style="display:none;" onclick="closeDetail(event)">
    <div class="modal">
        <button class="modal-close" onclick="closeDetail()">&times;</button>
        <h2 id="detailSubject"></h2>

        <label>Player</label>
        <p><a id="detailPlayer" class="player-link" href="#" target="_blank"></a></p>

        <label>Description</label>
        <p id="detailDesc"></p>

        <div class="info-grid">
            <div><span class="label">Status:</span> <span class="value" id="detailStatus"></span></div>
            <div><span class="label">Date:</span> <span class="value" id="detailDate"></span></div>
            <div><span class="label">IP:</span> <span class="value" id="detailIp"></span></div>
            <div><span class="label">Device:</span> <span class="value" id="detailDevice"></span></div>
            <div><span class="label">Platform:</span> <span class="value" id="detailPlatform"></span></div>
            <div><span class="label">Screen:</span> <span class="value" id="detailScreen"></span></div>
            <div><span class="label">Language:</span> <span class="value" id="detailLang"></span></div>
        </div>

        <hr>
        <label>Messages</label>
        <div id="msgList" class="msg-list"></div>

        <hr>
        <label for="replyInput">Reply to player</label>
        <textarea id="replyInput" style="width:100%;box-sizing:border-box;min-height:70px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;resize:vertical;font-family:inherit;font-size:14px;margin-bottom:8px" maxlength="5000" placeholder="Write your reply..."></textarea>
        <button id="sendReplyBtn" class="btn-sm btn-ok-sm" onclick="sendReply()">Send Reply</button>
        <span id="replyStatus" style="margin-left:8px;color:var(--ok);font-size:13px;display:none">Sent!</span>
    </div>
</div>

<script src="/js/admin-api.js?v=1.0.0"></script>
<script src="/js/support-client.js?v=1.0.0"></script>
<script>
var reports = [];

function loadReports() {
    var filter = document.getElementById('statusFilter').value;
    var tbody = document.getElementById('reportBody');
    tbody.innerHTML = '<tr><td colspan="5" class="loading">Loading...</td></tr>';

    AdminAPI.fetch('/api/admin/reports')
        .then(function(r) {
            if (!r.ok) throw new Error('Not authorized');
            return r.json();
        })
        .then(function(data) {
            reports = data;
            render(filter);
        })
        .catch(function() {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Failed to load. Are you admin?</td></tr>';
        });
}

function render(filter) {
    var filtered = filter === 'all' ? reports : reports.filter(function(r) { return r.status === filter; });
    var tbody = document.getElementById('reportBody');
    var countEl = document.getElementById('reportCount');

    countEl.textContent = filtered.length + ' report(s)';

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No reports</td></tr>';
        return;
    }

    tbody.innerHTML = '';
    filtered.forEach(function(r) {
        var tr = document.createElement('tr');
        var date = new Date(r.createdAt).toLocaleString();
        var badgeClass = 'badge-' + r.status;
        var playerName = r.userId ? (r.userId.username || 'Unknown') : 'Guest';

        tr.innerHTML =
            '<td style="white-space:nowrap">' + date + '</td>' +
            '<td>' + esc(playerName) + '</td>' +
            '<td><a href="#" onclick="showDetail(\'' + r._id + '\');return false" style="color:var(--accent);text-decoration:none">' + esc(r.subject) + '</a></td>' +
            '<td><span class="badge ' + badgeClass + '">' + r.status.replace('_', ' ') + '</span></td>' +
            '<td style="white-space:nowrap">' + actionButtons(r) + '</td>';

        tbody.appendChild(tr);
    });
}

function actionButtons(r) {
    var btns = '';
    if (r.status === 'new') {
        btns += '<button class="btn-sm btn-primary-sm" onclick="updateStatus(\'' + r._id + '\',\'in_progress\')">Take</button>';
    }
    if (r.status !== 'closed') {
        btns += '<button class="btn-sm btn-ok-sm" onclick="updateStatus(\'' + r._id + '\',\'closed\')">Close</button>';
    }
    if (r.status === 'closed' || r.status === 'in_progress') {
        btns += '<button class="btn-sm btn-danger-sm" onclick="updateStatus(\'' + r._id + '\',\'new\')">Reopen</button>';
    }
    return btns;
}

function updateStatus(id, status) {
    AdminAPI.fetch('/api/admin/reports/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: status })
    }).then(function(r) {
        if (!r.ok) throw new Error();
        return r.json();
    }).then(function() {
        loadReports();
    }).catch(function(err) { alert(err.message || 'Failed to update'); });
}

var _currentReportId = null;

var conversation = PQSupportClient(window, { admin: true, afterSend: loadReports });
function showDetail(id) { return conversation.open(id); }
function sendReply() { return conversation.send(); }
function closeDetail(event) { conversation.close(event); }

function esc(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s || ''));
    return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

loadReports();
</script>
</body>
</html>
