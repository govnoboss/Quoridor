<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Leaderboard — Quoridor</title>
    <meta name="description" content="Top Quoridor players ranked by rating. See the best players, their ratings and stats on the official leaderboard." />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="canonical" href="https://playquor.org/leaderboard" />
    <link rel="stylesheet" href="/css/style.css?v=1.0.4" type="text/css" />
    <link rel="stylesheet" href="/css/auth.css?v=1.0.4" type="text/css" />
    <link rel="stylesheet" href="/css/profile.css?v=1.0.4" type="text/css" />
    <script defer src="https://analytics.playquor.org/script.js" data-website-id="4efbc356-ed5e-4f8b-9761-c00a500f67c2"></script>
    <script src="/js/analytics.js?v=1.0.4"></script>
    <style>
        .lb-page {
            min-height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(var(--header-h) + 20px) 16px 80px;
        }
        .lb-container {
            width: 100%;
            max-width: 520px;
        }
        .lb-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .lb-header h1 {
            font-size: 1.4rem;
            margin: 0;
            flex: 1;
        }
        .lb-back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            color: var(--text);
            font-size: 1.2rem;
            text-decoration: none;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .lb-back-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        .lb-subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 16px;
            text-align: center;
        }
        .lb-loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .lb-empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .lb-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        }
        .lb-table th,
        .lb-table td {
            padding: 10px 14px;
            text-align: left;
        }
        .lb-table thead th {
            color: #888;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.02);
            white-space: nowrap;
        }
        .lb-table th.col-rank {
            width: 62px;
        }
        .lb-table th.col-rating {
            text-align: right;
        }
        .lb-table th.col-games {
            text-align: right;
        }
        .lb-table tbody tr {
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            transition: background 0.15s;
        }
        .lb-table tbody tr:last-child {
            border-bottom: none;
        }
        .lb-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .lb-table td {
            color: var(--text);
        }
        .lb-table td.col-rank {
            font-weight: 700;
            color: #aaa;
        }
        .lb-table td.col-rank.top1 {
            color: #e09f3e;
        }
        .lb-table td.col-rank.top2 {
            color: #c8c8c8;
        }
        .lb-table td.col-rank.top3 {
            color: #cd7f32;
        }
        .lb-table td.col-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .lb-table td.col-rating {
            text-align: right;
            font-weight: 700;
            color: #aaa;
            white-space: nowrap;
        }
        .lb-table td.col-games {
            text-align: right;
            color: #888;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .lb-page {
                padding: 16px 12px 80px;
            }
        }
    </style>
    <style>
        html, body {
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <a href="/" class="header-logo">QUORIDOR</a>
        </div>
        <div class="header-right">
            <select id="headerLang" class="header-lang" onchange="setLanguage(this.value)">
                <option value="ru">RU</option>
                <option value="en">EN</option>
            </select>
        </div>
    </header>

    <div class="lb-page">
        <div class="lb-container">
            <div class="lb-header">
                <a href="/" class="lb-back-btn" id="backBtn" aria-label="Back">&larr;</a>
                <h1 id="pageTitle">Leaderboard</h1>
            </div>
            <p class="lb-subtitle" id="pageSubtitle">Top 100 players by rating</p>
            <div class="leaderboard" id="leaderboardList">
                <div class="lb-loading" id="loadingText">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        var dict = {
            ru: {
                title: 'Лидеры',
                subtitle: 'Топ-100 игроков по рейтингу',
                loading: 'Загрузка...',
                empty: 'Пока нет игроков',
                error: 'Ошибка загрузки',
                col_rank: 'Ранг',
                col_name: 'Имя',
                col_rating: 'Рейтинг',
                col_games: 'Кол-во игр',
                games1: 'матч',
                games2: 'матча',
                games5: 'матчей'
            },
            en: {
                title: 'Leaderboard',
                subtitle: 'Top 100 players by rating',
                loading: 'Loading...',
                empty: 'No players yet',
                error: 'Failed to load',
                col_rank: 'Rank',
                col_name: 'Name',
                col_rating: 'Rating',
                col_games: 'Games',
                games1: 'game',
                games2: 'games',
                games5: 'games'
            }
        };

        function getLang() {
            return localStorage.getItem('quoridor-lang') || 'en';
        }

        function setLanguage(lang) {
            localStorage.setItem('quoridor-lang', lang);
            var d = dict[lang];
            document.title = d.title + ' — Quoridor';
            document.documentElement.lang = lang;
            document.getElementById('headerLang').value = lang;
            document.getElementById('pageTitle').textContent = d.title;
            document.getElementById('pageSubtitle').textContent = d.subtitle;
            var lt = document.getElementById('loadingText');
            if (lt) lt.textContent = d.loading;
            if (typeof loadLeaderboard === 'function') loadLeaderboard();
        }

        function applyLang() {
            setLanguage(getLang());
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function pluralGames(n, d) {
            var n10 = n % 10,
                n100 = n % 100;
            if (n100 >= 11 && n100 <= 14) return d.games5;
            if (n10 === 1) return d.games1;
            if (n10 >= 2 && n10 <= 4) return d.games2;
            return d.games5;
        }

        function loadLeaderboard() {
            var container = document.getElementById('leaderboardList');
            var lang = getLang();
            var d = dict[lang];

            fetch('/api/leaderboard?limit=100')
                .then(function(r) { return r.json(); })
                .then(function(players) {
                    if (!players || players.length === 0) {
                        container.innerHTML = '<div class="lb-empty">' + d.empty + '</div>';
                        return;
                    }

                    container.innerHTML = '<table class="lb-table">'
                            + '<thead><tr>'
                            + '<th class="col-rank">' + d.col_rank + '</th>'
                            + '<th class="col-name">' + d.col_name + '</th>'
                            + '<th class="col-rating">' + d.col_rating + '</th>'
                            + '<th class="col-games">' + d.col_games + '</th>'
                            + '</tr></thead><tbody>'
                            + players.map(function(p, i) {
                                var rankClass = '';
                                if (i === 0) rankClass = ' top1';
                                else if (i === 1) rankClass = ' top2';
                                else if (i === 2) rankClass = ' top3';

                                return '<tr onclick="window.location.href=\'/profiles/' + encodeURIComponent(p.username) + '\'">'
                                    + '<td class="col-rank' + rankClass + '">' + (i + 1) + '</td>'
                                    + '<td class="col-name">' + escapeHtml(p.username) + '</td>'
                                    + '<td class="col-rating">' + p.rating + '</td>'
                                    + '<td class="col-games">' + (p.stats ? (p.stats.totalGames || 0) : 0) + ' ' + pluralGames(p.stats ? (p.stats.totalGames || 0) : 0, d) + '</td>'
                                    + '</tr>';
                            }).join('')
                            + '</tbody></table>';
                })
                .catch(function() {
                    container.innerHTML = '<div class="lb-empty">' + d.error + '</div>';
                });
        }

        applyLang();
    </script>
</body>
</html>
