<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports | PlayQuor</title>
    <meta name="description" content="Your bug reports and replies from the PlayQuor team." />
    <meta name="robots" content="noindex,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/tokens.css?v=2.0.0" type="text/css" />
    <link rel="stylesheet" href="/css/components.css?v=1.2.0" type="text/css" />
    <link rel="stylesheet" href="/css/header.css?v=1.1.0" type="text/css" />
    <link rel="stylesheet" href="/css/auth-pages.css?v=1.0.6" type="text/css" />
    <link rel="stylesheet" href="/css/style.css?v=1.0.40" type="text/css" />
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --muted: #94a3b8;
            --text: #e2e8f0;
            --accent: #f59e0b;
            --ok: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }
        body {
            margin: 0;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            padding-top: var(--header-h);
        }
        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }
        h1 { margin-top: 0; font-size: 22px; }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .report-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .report-card:hover { border-color: var(--accent); }
        .report-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .report-card-subject {
            font-size: 15px;
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-new { background: #3b82f6; color: #fff; }
        .badge-in_progress { background: #f59e0b; color: #000; }
        .badge-closed { background: #64748b; color: #fff; }
        .report-card-meta {
            font-size: 12px;
            color: var(--muted);
        }
        .report-card-msgs {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 16px;
            color: var(--muted);
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--muted);
        }

        /* Detail view */
        .detail-view {
            display: none;
        }
        .detail-view.active {
            display: block;
        }
        .list-view.hidden {
            display: none;
        }
        .msg-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 13px;
            line-height: 1.4;
        }
        .msg-user {
            align-self: flex-end;
            background: #3b82f6;
            color: #fff;
        }
        .msg-admin {
            align-self: flex-start;
            background: #334155;
            color: var(--text);
        }
        .msg-role {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 2px;
        }
        .msg-time {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }
        .reply-section {
            margin-top: 16px;
        }
        .reply-section textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 70px;
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .reply-section .btn-sm {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-ok-sm { background: var(--ok); color: #000; }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin-bottom: 16px;
        }
        .back-btn:hover { text-decoration: underline; }
        .detail-info {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .detail-status {
            display: inline-block;
            margin-left: 8px;
        }
    </style>
<script defer src="https://analytics.playquor.org/script.js" data-exclude-search="true" data-website-id="4efbc356-ed5e-4f8b-9761-c00a500f67c2"></script>
<script src="/js/analytics.js?v=1.5.1"></script>
</head>
<body>
<div id="siteHeader"></div>
<noscript><a href="/" style="color:#F2F2F2;padding:16px;display:block">PlayQuor</a></noscript>
<script src="/js/site-shell.js?v=1.2.0"></script>
<div class="container">
    <div id="listView" class="list-view">
        <h1 id="pageTitle">My Reports</h1>
        <div id="reportList"></div>
    </div>

    <div id="detailView" class="detail-view">
        <button class="back-btn" id="backToListBtn" onclick="showList()">← Back to reports</button>
        <h2 id="detailSubject"></h2>
        <div class="detail-info">
            <span id="detailDate"></span>
            <span class="badge detail-status" id="detailStatus"></span>
        </div>
        <p id="detailDesc" style="font-size:14px;line-height:1.5;white-space:pre-wrap;color:#ccc;margin-bottom:16px"></p>
        <label style="color:var(--muted);font-size:13px;display:block;margin-bottom:4px" id="lblMessages">Messages</label>
        <div id="msgList" class="msg-list"></div>
        <div class="reply-section" id="replySection">
            <textarea id="replyInput" aria-label="Your reply" placeholder="Write a message..." maxlength="5000"></textarea>
            <button class="btn-sm btn-ok-sm" id="sendReplyBtn" onclick="sendReply()">Send</button>
            <span id="replyStatus" style="margin-left:8px;color:var(--ok);font-size:13px;display:none">Sent!</span>
        </div>
    </div>
</div>

<script src="/js/support-client.js?v=1.0.0"></script>
<script>
var currentReportId = null;

function showList() { conversation.close(); }

var conversation = PQSupportClient(window, { admin: false, afterSend: loadReports });
function showDetail(id) { return conversation.open(id); }
function sendReply() { return conversation.send(); }
function closeDetail(event) { conversation.close(event); }

function loadReports() {
    var list = document.getElementById('reportList');
    list.innerHTML = '<div class="loading">Loading...</div>';

    fetch('/api/auth/me')
        .then(function(r) {
            if (!r.ok) {
                list.innerHTML = '<div class="empty-state">You must be logged in to view reports. <a href="/login" style="color:var(--accent)">Sign in</a></div>';
                throw new Error('Not authenticated');
            }
            return r.json();
        })
        .then(function(auth) {
            if (!auth.isAuthenticated) throw new Error('Sign in to view your reports');
            return fetch('/api/my/reports');
        })
        .then(function(r) {
            if (!r.ok) throw new Error();
            return r.json();
        })
        .then(function(data) {
            if (!data || data.length === 0) {
                list.innerHTML = '<div class="empty-state">You haven\'t submitted any reports yet.</div>';
                return;
            }
            list.innerHTML = '';
            data.forEach(function(r) {
                var card = document.createElement('div');
                card.className = 'report-card';
                card.onclick = function() { showDetail(r._id); };

                var msgCount = (r.messages || []).length;
                var header = document.createElement('div');
                header.className = 'report-card-header';
                header.innerHTML = '<span class="report-card-subject">' + esc(r.subject) + '</span>' +
                    '<span class="badge badge-' + r.status + '">' + r.status.replace('_', ' ') + '</span>';

                var meta = document.createElement('div');
                meta.className = 'report-card-meta';
                meta.textContent = new Date(r.createdAt).toLocaleDateString();

                var msgs = document.createElement('div');
                msgs.className = 'report-card-msgs';
                msgs.textContent = msgCount + ' message(s)';

                card.appendChild(header);
                card.appendChild(meta);
                card.appendChild(msgs);
                list.appendChild(card);
            });
        })
        .catch(function() {
            list.innerHTML = '<div class="empty-state">Failed to load reports.</div>';
        });
}

function esc(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s || ''));
    return div.innerHTML;
}

loadReports();
</script>
  <div id="siteFooter"></div>
</body>
</html>
