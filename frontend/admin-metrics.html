<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quoridor Analytics</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --panel: #1e293b;
            --muted: #94a3b8;
            --text: #e2e8f0;
            --accent: #f59e0b;
            --ok: #22c55e;
            --danger: #ef4444;
            --border: #334155;
            --info: #3b82f6;
        }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
        h1, h2, h3 { margin-top: 0; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
        .stat-card .number { font-size: 26px; font-weight: 700; color: var(--text); }
        .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .stat-card.accent .number { color: var(--accent); }
        .stat-card.ok .number { color: var(--ok); }
        .stat-card.info .number { color: var(--info); }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); }
        .nav a:hover { color: var(--text); border-color: var(--accent); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; }
        .loading { text-align: center; padding: 20px; color: var(--muted); }
        .refresh-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
        .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
        select, button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
        .bar-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; height: 14px; overflow: hidden; }
        .bar { height: 100%; background: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center">
        <h1>Analytics</h1>
        <div style="display:flex;gap:8px;align-items:center">
            <label style="font-size:12px;color:var(--muted)">Range</label>
            <select id="rangeSelect" onchange="loadMetrics()">
                <option value="7">7 days</option>
                <option value="14">14 days</option>
                <option value="30">30 days</option>
            </select>
            <button class="refresh-btn" onclick="loadMetrics()">Refresh</button>
        </div>
    </div>

    <div class="nav">
        <a href="/admin">Dashboard</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/user-reports">User Reports</a>
        <a href="/admin/reports">Bug Reports</a>
        <a href="/admin/bots">Bots</a>
        <a href="/admin/metrics" class="active">Analytics</a>
        <a href="/admin/logs">Admin Logs</a>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card accent"><div class="number" id="statEvents">-</div><div class="label">Events</div></div>
        <div class="stat-card info"><div class="number" id="statUsers">-</div><div class="label">Active Users</div></div>
        <div class="stat-card ok"><div class="number" id="statPuzzleSolved">-</div><div class="label">Puzzles Solved</div></div>
        <div class="stat-card"><div class="number" id="statPuzzleViews">-</div><div class="label">Puzzle Views</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="panel">
            <h3>Events by name</h3>
            <div id="byName"><div class="loading">Loading...</div></div>
        </div>
        <div class="panel">
            <h3>Daily volume</h3>
            <div id="daily"><div class="loading">Loading...</div></div>
        </div>
    </div>
</div>

<script src="/js/analytics.js?v=1.1.0"></script>
<script>
    function el(id) { return document.getElementById(id); }

    function maxCount(arr) {
        var m = 0;
        arr.forEach(function (r) { if (r.count > m) m = r.count; });
        return m || 1;
    }

    function renderByName(rows) {
        if (!rows || !rows.length) {
            el('byName').innerHTML = '<div class="loading">No data</div>';
            return;
        }
        var html = '<table><thead><tr><th>Event</th><th>Count</th><th>Users</th></tr></thead><tbody>';
        rows.forEach(function (r) {
            html += '<tr><td>' + r.name + '</td><td>' + r.count + '</td><td>' + r.users + '</td></tr>';
        });
        html += '</tbody></table>';
        el('byName').innerHTML = html;
    }

    function renderDaily(rows) {
        if (!rows || !rows.length) {
            el('daily').innerHTML = '<div class="loading">No data</div>';
            return;
        }
        var max = maxCount(rows);
        var html = '<table><thead><tr><th>Date</th><th>Events</th></tr></thead><tbody>';
        rows.forEach(function (r) {
            html += '<tr><td>' + r.date + '</td><td style="width:70%"><div class="bar-wrap"><div class="bar" style="width:' + Math.round((r.count / max) * 100) + '%"></div></div> <span style="color:var(--muted)">' + r.count + '</span></td></tr>';
        });
        html += '</tbody></table>';
        el('daily').innerHTML = html;
    }

    async function loadMetrics() {
        var days = el('rangeSelect').value;
        try {
            var res = await fetch('/api/admin/metrics?days=' + days, { credentials: 'same-origin' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var data = await res.json();
            el('statEvents').textContent = data.totalEvents;
            el('statUsers').textContent = data.activeUsers;
            el('statPuzzleSolved').textContent = data.puzzleSolved;
            el('statPuzzleViews').textContent = data.puzzleViews;
            renderByName(data.byName);
            renderDaily(data.daily);
            trackEvent('admin-metrics-viewed', { days: days });
        } catch (e) {
            el('byName').innerHTML = '<div class="loading">Failed to load metrics</div>';
            el('daily').innerHTML = '<div class="loading">Failed to load metrics</div>';
        }
    }

    window.addEventListener('DOMContentLoaded', loadMetrics);
</script>
</body>
</html>
