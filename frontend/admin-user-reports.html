<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quoridor Admin: User Reports</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --panel: #1e293b;
            --muted: #94a3b8;
            --text: #e2e8f0;
            --accent: #f59e0b;
            --ok: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
        h1, h2, h3 { margin-top: 0; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); }
        .nav a:hover, .nav a.active { color: var(--text); border-color: var(--accent); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .badge-new { background: #3b82f6; color: #fff; }
        .badge-in_progress { background: var(--accent); color: #000; }
        .badge-resolved { background: var(--ok); color: #000; }
        .badge-dismissed { background: #64748b; color: #fff; }
        .btn-sm { padding: 4px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-sm + .btn-sm { margin-left: 4px; }
        .btn-primary-sm { background: var(--accent); color: #000; }
        .btn-ok-sm { background: var(--ok); color: #000; }
        .btn-info-sm { background: #3b82f6; color: #fff; }
        .btn-danger-sm { background: var(--danger); color: #fff; }
        .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
        .filter-bar select { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; }
        .empty-state { text-align: center; padding: 40px; color: var(--muted); }
        .loading { text-align: center; padding: 40px; color: var(--muted); }
        .back-link { display: inline-block; margin-bottom: 16px; color: var(--accent); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 550px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal h2 { margin-top: 0; font-size: 16px; }
        .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
        .modal label { color: var(--muted); font-size: 13px; display: block; margin-top: 12px; margin-bottom: 4px; }
        .modal p { margin: 0 0 12px; line-height: 1.5; font-size: 14px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13px; margin-bottom: 8px; }
        .info-grid .label { color: var(--muted); }
        .info-grid .value { color: var(--text); word-break: break-all; }
        .player-link { color: var(--accent); text-decoration: none; }
        .player-link:hover { text-decoration: underline; }
        hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
        .actions-row { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container">
    <a href="/admin" class="back-link">← Admin Dashboard</a>
    <h1>User Reports</h1>

    <div class="panel">
        <div class="filter-bar">
            <span>Status:</span>
            <select id="statusFilter" onchange="loadReports()">
                <option value="all">All</option>
                <option value="new" selected>New</option>
                <option value="in_progress">In Progress</option>
                <option value="resolved">Resolved</option>
                <option value="dismissed">Dismissed</option>
            </select>
            <span style="margin-left:auto;color:var(--muted);font-size:13px" id="reportCount"></span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Reporter</th>
                    <th>Target</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="reportBody">
                <tr><td colspan="6" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="detailModal" class="modal-overlay" style="display:none;" onclick="closeDetail(event)">
    <div class="modal">
        <button class="modal-close" onclick="closeDetail()">&times;</button>
        <h2 id="detailReason"></h2>

        <div class="info-grid">
            <div><span class="label">Reporter:</span> <span class="value" id="detailReporter"></span></div>
            <div><span class="label">Target:</span> <span class="value" id="detailTarget"></span></div>
            <div><span class="label">Date:</span> <span class="value" id="detailDate"></span></div>
            <div><span class="label">Status:</span> <span class="value" id="detailStatus"></span></div>
        </div>

        <label>Description</label>
        <p id="detailDesc"></p>

        <div id="adminNoteSection">
            <label>Admin Note</label>
            <p id="detailAdminNote" style="color:var(--muted)"></p>
        </div>

        <hr>
        <label>Admin Note (for resolution)</label>
        <textarea id="adminNoteInput" style="width:100%;box-sizing:border-box;min-height:60px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;resize:vertical;font-family:inherit;font-size:13px;margin-bottom:8px" placeholder="Optional note..."></textarea>

        <div class="actions-row">
            <button class="btn-sm btn-info-sm" onclick="setReportStatus('in_progress')">In Progress</button>
            <button class="btn-sm btn-ok-sm" onclick="setReportStatus('resolved')">Resolve</button>
            <button class="btn-sm btn-danger-sm" onclick="setReportStatus('dismissed')">Dismiss</button>
        </div>
    </div>
</div>

<script>
var reports = [];
var _currentReportId = null;

function loadReports() {
    var filter = document.getElementById('statusFilter').value;
    var tbody = document.getElementById('reportBody');
    tbody.innerHTML = '<tr><td colspan="6" class="loading">Loading...</td></tr>';

    fetch('/api/admin/user-reports?status=' + filter)
        .then(function(r) { if (!r.ok) throw new Error('Not authorized'); return r.json(); })
        .then(function(data) {
            reports = data;
            render(filter);
        })
        .catch(function() {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Failed to load. Are you admin?</td></tr>';
        });
}

function render(filter) {
    var filtered = filter === 'all' ? reports : reports;
    var tbody = document.getElementById('reportBody');
    document.getElementById('reportCount').textContent = filtered.length + ' report(s)';

    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No reports</td></tr>';
        return;
    }

    tbody.innerHTML = '';
    filtered.forEach(function(r) {
        var tr = document.createElement('tr');
        var date = new Date(r.createdAt).toLocaleString();
        var reporter = r.reporter ? r.reporter.username : 'Unknown';
        var target = r.target ? r.target.username : 'Unknown';

        tr.innerHTML =
            '<td style="white-space:nowrap">' + date + '</td>' +
            '<td><a class="player-link" href="/admin/users">' + esc(reporter) + '</a></td>' +
            '<td><a class="player-link" href="/admin/users">' + esc(target) + '</a></td>' +
            '<td>' + esc(reasonLabel(r.reason)) + '</td>' +
            '<td><span class="badge badge-' + r.status + '">' + r.status + '</span></td>' +
            '<td><button class="btn-sm btn-primary-sm" onclick="showDetail(\'' + r._id + '\')">View</button></td>';
        tbody.appendChild(tr);
    });
}

function showDetail(id) {
    _currentReportId = id;
    var r = reports.find(function(x) { return x._id === id; });
    if (!r) return;

    document.getElementById('detailReason').textContent = reasonLabel(r.reason);
    document.getElementById('detailReporter').innerHTML = '<a class="player-link" href="/admin/users">' + esc(r.reporter ? r.reporter.username : '?') + '</a>';
    document.getElementById('detailTarget').innerHTML = '<a class="player-link" href="/admin/users">' + esc(r.target ? r.target.username : '?') + '</a>';
    document.getElementById('detailDate').textContent = new Date(r.createdAt).toLocaleString();
    document.getElementById('detailStatus').textContent = r.status;
    document.getElementById('detailDesc').textContent = r.description || '(none)';
    document.getElementById('detailAdminNote').textContent = r.adminNote || '(none)';
    document.getElementById('adminNoteInput').value = '';
    document.getElementById('adminNoteSection').style.display = r.adminNote ? '' : 'none';
    document.getElementById('detailModal').style.display = 'flex';
}

function setReportStatus(status) {
    var note = document.getElementById('adminNoteInput').value.trim();
    fetch('/api/admin/user-reports/' + _currentReportId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: status, adminNote: note })
    })
    .then(function(r) { return r.json(); })
    .then(function() {
        closeDetail();
        loadReports();
    })
    .catch(function() { alert('Failed'); });
}

function closeDetail(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('detailModal').style.display = 'none';
}

function reasonLabel(reason) {
    var labels = {
        inappropriate_avatar: 'Inappropriate Avatar',
        inappropriate_username: 'Inappropriate Username',
        inappropriate_bio: 'Inappropriate Bio',
        inappropriate_status: 'Inappropriate Status',
        cheating: 'Cheating',
        harassment: 'Harassment',
        impersonation: 'Impersonation',
        other: 'Other'
    };
    return labels[reason] || reason;
}

function esc(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s || ''));
    return div.innerHTML;
}

loadReports();
</script>
</body>
</html>
