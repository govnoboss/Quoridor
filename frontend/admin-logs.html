<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quoridor Admin: Logs</title>
    <link rel="stylesheet" href="/css/tokens.css?v=2.0.1">
    <link rel="stylesheet" href="/css/admin.css?v=1.0.0">
    <script src="/js/admin-shell.js?v=1.1.0" defer></script>
<script defer src="https://analytics.playquor.org/script.js" data-exclude-search="true" data-website-id="4efbc356-ed5e-4f8b-9761-c00a500f67c2"></script>
<script src="/js/analytics.js?v=1.5.0"></script>
</head>
<body class="admin-app" data-admin-page="logs">
<main class="admin-main container" id="adminMain" tabindex="-1">
    <header class="admin-page-heading"><div><div class="admin-eyebrow">Operations</div><h1>Activity log</h1><p class="admin-page-description">A record of administrative decisions and changes.</p></div><div class="admin-page-actions"><button class="refresh-btn" onclick="loadLogs()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>Refresh</button></div></header>

    <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="color:var(--muted);font-size:13px" id="logCount"></span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Admin</th>
                    <th>Action</th>
                    <th>Target</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <tr><td colspan="5" class="loading">Loading...</td></tr>
            </tbody>
        </table>
        <div class="admin-pagination">
            <button id="prevPageBtn" onclick="prevPage()">← Prev</button>
            <span id="pageIndicator" style="margin:0 12px;color:var(--muted);font-size:13px"></span>
            <button id="nextPageBtn" onclick="nextPage()">Next →</button>
        </div>
    </div>
</main>

<script src="/js/admin-api.js?v=1.0.0"></script>
<script>
var logs = [];
var currentPage = 1;
var totalPages = 1;

function loadLogs() {
    var tbody = document.getElementById('logBody');
    tbody.innerHTML = '<tr><td colspan="5" class="loading">Loading...</td></tr>';

    AdminAPI.fetch('/api/admin/logs?page=' + currentPage + '&limit=20')
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function(data) {
            logs = data.logs;
            totalPages = Math.ceil(data.total / 20) || 1;
            document.getElementById('logCount').textContent = data.total + ' total, page ' + currentPage;
            renderLogs();
            updatePagination();
        })
        .catch(function() {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Failed to load. Are you admin?</td></tr>';
        });
}

function renderLogs() {
    var tbody = document.getElementById('logBody');
    if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No logs yet</td></tr>';
        return;
    }
    tbody.innerHTML = '';
    logs.forEach(function(l) {
        var tr = document.createElement('tr');
        var actionClass = '';
        if (l.action.indexOf('ban') !== -1 && l.action.indexOf('unban') === -1) actionClass = 'action-ban';
        else if (l.action.indexOf('unban') !== -1) actionClass = 'action-unban';
        else if (l.action.indexOf('role') !== -1) actionClass = 'action-role';
        else if (l.action.indexOf('rating') !== -1) actionClass = 'action-rating';
        else if (l.action.indexOf('delete') !== -1) actionClass = 'action-delete';
        else if (l.action.indexOf('report') !== -1) actionClass = 'action-report';

        var details = '';
        if (l.details && typeof l.details === 'object') {
            var parts = [];
            if (l.details.reason) parts.push('Reason: ' + l.details.reason);
            if (l.details.oldRating !== undefined) parts.push(l.details.oldRating + ' → ' + l.details.newRating);
            if (l.details.isAdmin !== undefined) parts.push(l.details.isAdmin ? 'Made admin' : 'Removed admin');
            if (l.details.durationDays) parts.push(l.details.durationDays + ' days');
            details = parts.join(', ');
        }

        tr.innerHTML =
            '<td style="white-space:nowrap">' + new Date(l.createdAt).toLocaleString() + '</td>' +
            '<td>' + esc(l.admin ? l.admin.username : '?') + '</td>' +
            '<td><span class="' + actionClass + '" style="font-weight:600">' + esc(l.action) + '</span></td>' +
            '<td>' + esc(l.targetUsername || l.target || '') + '</td>' +
            '<td style="color:var(--muted);font-size:12px">' + esc(details) + '</td>';
        tbody.appendChild(tr);
    });
}

function updatePagination() {
    document.getElementById('prevPageBtn').style.display = currentPage > 1 ? '' : 'none';
    document.getElementById('nextPageBtn').style.display = currentPage < totalPages ? '' : 'none';
    document.getElementById('pageIndicator').textContent = currentPage + ' / ' + totalPages;
}
function prevPage() { currentPage--; loadLogs(); }
function nextPage() { currentPage++; loadLogs(); }

function esc(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s || ''));
    return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

loadLogs();
</script>
</body>
</html>
