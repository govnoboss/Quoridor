<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Sign In | PlayQuor</title>
    <meta name="description" content="Sign in to PlayQuor to play ranked Quoridor online, track your rating and challenge friends." />
    <link rel="canonical" href="https://playquor.org/login" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/tokens.css?v=2.0.0" type="text/css" />
    <link rel="stylesheet" href="/css/components.css?v=1.2.0" type="text/css" />
    <link rel="stylesheet" href="/css/header.css?v=1.1.0" type="text/css" />
    <link rel="stylesheet" href="/css/style.css?v=1.0.31" type="text/css" />
    <link rel="stylesheet" href="/css/auth.css?v=1.0.6" type="text/css" />
    <link rel="stylesheet" href="/css/auth-pages.css?v=1.0.6" type="text/css" />
    <script defer src="https://analytics.playquor.org/script.js" data-website-id="4efbc356-ed5e-4f8b-9761-c00a500f67c2"></script>
    <script src="/js/analytics.js?v=1.1.0"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .auth-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: #888; font-size: 13px; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: #333; }
        .google-btn-slot { display: flex; justify-content: center; margin-bottom: 8px; }
    </style>
</head>
<body class="auth-page-body">
    <div id="siteHeader"></div>
    <noscript><a href="/" style="color:#F2F2F2;padding:16px;display:block">PlayQuor</a></noscript>
    <script src="/js/site-shell.js?v=1.0.0"></script>

    <div class="auth-page-container">
        <div class="auth-form-wrapper">
            <button class="close-panel-btn" onclick="window.history.back()">&times;</button>
            <h1 id="pageTitle">Sign In</h1>
            <div id="authError" class="auth-error"></div>
            <form class="auth-form" id="loginForm" onsubmit="submitLogin(event)" novalidate>
                <div class="field-group">
                    <label class="field-label" id="loginUsernameLabel" for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" autocomplete="username" required oninput="liveValidateField(this)" />
                    <div id="usernameError" class="field-error"></div>
                </div>
                <div class="field-group">
                    <label class="field-label" id="loginPasswordLabel" for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" autocomplete="current-password" required oninput="liveValidateField(this)" />
                        <span class="password-toggle" onclick="togglePassword('loginPassword', this)">&#128065;</span>
                    </div>
                    <div id="passwordError" class="field-error"></div>
                </div>
                <div class="auth-fp-wrapper">
                    <a href="/forgot-password" class="auth-link small" data-i18n="link_forgot_pass">Forgot password?</a>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
            </form>
            <div class="auth-divider"><span>or</span></div>
            <div id="googleBtn" class="google-btn-slot"></div>
            <div class="auth-footer-links">
                <span id="footerText">No account?</span>
                <a href="/register" id="footerLink">Register</a>
            </div>
        </div>
    </div>

    <script>
        var dict = {
            ru: {
                title: 'Вход',
                username_label: 'Имя пользователя',
                password_label: 'Пароль',
                submit: 'Войти',
                footer: 'Нет аккаунта?',
                footer_link: 'Зарегистрироваться',
                error_username_empty: 'Введите имя пользователя',
                error_password_empty: 'Введите пароль',
                error_invalid: 'Неверный логин или пароль',
                error_network: 'Ошибка сети',
                forgot_link: 'Забыли пароль?',
                error_google: 'Не удалось войти через Google',
                page_title: 'Вход | PlayQuor',
            },
            en: {
                title: 'Sign In',
                username_label: 'Username',
                password_label: 'Password',
                submit: 'Sign In',
                footer: 'No account?',
                footer_link: 'Register',
                error_username_empty: 'Please enter your username',
                error_password_empty: 'Please enter your password',
                error_invalid: 'Invalid username or password',
                error_network: 'Network error',
                forgot_link: 'Forgot password?',
                error_google: 'Could not sign in with Google',
                page_title: 'Sign In | PlayQuor',
            }
        };

        function getLang() {
            return localStorage.getItem('quoridor-lang') || 'en';
        }

        function setLanguage(lang) {
            localStorage.setItem('quoridor-lang', lang);
            var d = dict[lang];
            document.title = d.page_title;
            document.documentElement.lang = lang;
            document.getElementById('headerLang').value = lang;
            document.getElementById('pageTitle').textContent = d.title;
            document.getElementById('loginUsernameLabel').textContent = d.username_label;
            document.getElementById('loginPasswordLabel').textContent = d.password_label;
            document.getElementById('submitBtn').textContent = d.submit;
            document.getElementById('footerText').textContent = d.footer;
            document.getElementById('footerLink').textContent = d.footer_link;
            var fp = document.querySelector('.auth-fp-wrapper a');
            if (fp) fp.textContent = d.forgot_link;
        }

        function applyLang() {
            setLanguage(getLang());
        }

        function togglePassword(inputId, el) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                el.textContent = '\u{1F441}';
            } else {
                input.type = 'password';
                el.textContent = '\u{1F441}';
            }
        }

        function clearFieldErrors() {
            document.querySelectorAll('.field-error').forEach(function(el) {
                el.classList.remove('visible');
                el.textContent = '';
            });
            document.querySelectorAll('.field-group input').forEach(function(el) {
                el.classList.remove('input-error');
            });
            document.getElementById('authError').classList.remove('visible');
        }

        function liveValidateField(input) {
            var errEl = document.getElementById(input.id + 'Error');
            var val = input.value.trim();
            var d = dict[getLang()];
            var msg = '';
            if (!val) {
                msg = (input.id === 'loginPassword') ? d.error_password_empty : d.error_username_empty;
            }
            if (msg) {
                input.classList.add('input-error');
                errEl.textContent = msg;
                errEl.classList.add('visible');
            } else {
                input.classList.remove('input-error');
                errEl.classList.remove('visible');
                errEl.textContent = '';
            }
            document.getElementById('authError').classList.remove('visible');
        }

        function showFieldError(inputId, msg) {
            var input = document.getElementById(inputId);
            if (input) input.classList.add('input-error');
            var errorEl = document.getElementById(inputId + 'Error');
            if (errorEl) {
                errorEl.textContent = msg;
                errorEl.classList.add('visible');
            }
        }

        function showGlobalError(msg) {
            var el = document.getElementById('authError');
            el.textContent = msg;
            el.classList.add('visible');
        }

        function submitLogin(e) {
            e.preventDefault();
            clearFieldErrors();
            var lang = getLang();
            var d = dict[lang];
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value;
            var hasError = false;

            if (!username) {
                showFieldError('loginUsername', d.error_username_empty);
                hasError = true;
            }
            if (!password) {
                showFieldError('loginPassword', d.error_password_empty);
                hasError = true;
            }
            if (hasError) return;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            }).then(function(r) {
                return r.json().then(function(data) { return { status: r.status, data: data }; });
            }).then(function(resp) {
                if (resp.status === 200) {
                    trackEvent('login-complete');
                    window.location.href = '/';
                } else {
                    showFieldError('loginUsername', d.error_invalid);
                    showFieldError('loginPassword', '');
                }
            }).catch(function() {
                showGlobalError(d.error_network);
            });
        }

        function onGoogleCredential(response) {
            fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            }).then(function(r) {
                return r.json().then(function(data) { return { status: r.status, data: data }; });
            }).then(function(resp) {
                if (resp.status === 200) {
                    trackEvent('login-complete');
                    window.location.href = '/';
                } else {
                    showGlobalError(dict[getLang()].error_google);
                }
            }).catch(function() {
                showGlobalError(dict[getLang()].error_network);
            });
        }

        function initGoogleSignIn() {
            if (!window.google || !google.accounts || !google.accounts.id) {
                setTimeout(initGoogleSignIn, 200);
                return;
            }
            fetch('/api/auth/config').then(function(r) { return r.json(); }).then(function(cfg) {
                if (!cfg.googleClientId) return;
                google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: onGoogleCredential });
                var el = document.getElementById('googleBtn');
                if (el) google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', text: 'signin_with', width: 320 });
            }).catch(function() { /* never block password login */ });
        }

        initGoogleSignIn();
        applyLang();
    </script>
  <div id="siteFooter"></div>
</body>
</html>
